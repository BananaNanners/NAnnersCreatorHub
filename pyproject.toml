[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanners-creator-hub"
version = "0.2.0.dev4+fix2"
description = "Local-first YouTube tutorial production assistant"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[tool.setuptools.packages.find]
where = ["src"]
